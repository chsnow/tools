<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Disneyland Resort Rides</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DL Rides">

  <!-- Manifest and Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">

  <style>
* {
  box-sizing: border-box;
}

body {
  font-family: Helvetica, Arial, sans-serif;
  margin: 0;
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top));
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  padding-left: calc(20px + env(safe-area-inset-left));
  padding-right: calc(20px + env(safe-area-inset-right));
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  min-height: 100vh;
  color: #fff;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

.sticky-header {
  position: sticky;
  top: 0;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  padding-top: calc(12px + env(safe-area-inset-top));
  margin: calc(-20px - env(safe-area-inset-top)) -20px 0 -20px;
  padding-left: 20px;
  padding-right: 20px;
  padding-bottom: 12px;
  margin-bottom: 16px;
  z-index: 100;
}

.park-toggle {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  position: relative;
}

.favorites-filter {
  position: absolute;
  right: 0;
  background: none;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 6px;
  color: rgba(255,255,255,0.6);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  transition: all 0.2s;
}

.favorites-filter:hover {
  border-color: rgba(255,255,255,0.7);
  color: rgba(255,255,255,0.9);
}

.favorites-filter.active {
  background: #fff;
  border-color: #fff;
  color: #1a1a2e;
}

.park-btn {
  padding: 8px 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  background: transparent;
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.park-btn:hover {
  border-color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.1);
}

.park-btn.active {
  background: #fff;
  color: #1a1a2e;
  border-color: #fff;
}

.entity-tabs {
  display: flex;
  justify-content: center;
  gap: 5px;
}

.entity-tab {
  padding: 8px 18px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.entity-tab:hover {
  background: rgba(255,255,255,0.2);
  color: #fff;
}

.entity-tab.active {
  background: rgba(255,255,255,0.25);
  color: #fff;
}

.loading {
  text-align: center;
  padding: 40px;
  font-size: 1.2rem;
}

.spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
  margin-bottom: 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.error {
  background: #ff4444;
  padding: 20px;
  border-radius: 8px;
  text-align: center;
}

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.filters input {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  background: rgba(255,255,255,0.1);
  color: #fff;
}

.filters input::placeholder {
  color: rgba(255,255,255,0.5);
}

.filters select {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  background: rgba(255,255,255,0.1);
  color: #fff;
  cursor: pointer;
}

.rides-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.card-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
}

.card-action {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  display: flex;
  align-items: center;
  font-weight: bold;
  font-size: 0.9rem;
  z-index: 1;
}

.card-action-left {
  right: 0;
  justify-content: flex-end;
  padding-right: 20px;
  background: #4caf50;
}

.card-action-left.ready {
  background: #2e7d32;
}

.card-action-right {
  left: 0;
  justify-content: flex-start;
  padding-left: 20px;
  background: #2196f3;
}

.card-action-right.ready {
  background: #1565c0;
}

.ride-card.in-queue {
  border: 2px solid #2196f3;
}

.queue-timer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 6px 10px;
  background: rgba(33, 150, 243, 0.2);
  border-radius: 6px;
  font-size: 0.9rem;
}

.queue-timer-label {
  color: #64b5f6;
}

.queue-timer-value {
  font-weight: bold;
  font-family: monospace;
  font-size: 1rem;
}

.ride-card {
  position: relative;
  background: #252542;
  border-radius: 12px;
  padding: 20px;
  transition: background 0.2s;
  touch-action: pan-y pinch-zoom;
  z-index: 2;
}

.ride-card.swiping {
  transition: none;
}

.ride-card:hover {
  background: #2d2d4a;
}

.ride-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}

.ride-name {
  font-size: 1.1rem;
  font-weight: bold;
  flex: 1;
}

.star-btn {
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1.5px rgba(255,255,255,0.6);
  transition: color 0.2s, transform 0.2s, -webkit-text-stroke 0.2s;
}

.star-btn:hover {
  -webkit-text-stroke-color: rgba(255,255,255,0.9);
}

.star-btn.favorited {
  color: #fff;
  -webkit-text-stroke: 1.5px #fff;
}

.star-btn:active {
  transform: scale(1.2);
}

.ride-status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: bold;
  text-transform: uppercase;
}

.status-operating {
  background: #4caf50;
  color: #fff;
}

.status-closed {
  background: #f44336;
  color: #fff;
}

.status-down {
  background: #ff9800;
  color: #fff;
}

.status-refurbishment {
  background: #9c27b0;
  color: #fff;
}

.status-unknown {
  background: #607d8b;
  color: #fff;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.wait-time {
  font-size: 1.4rem;
  font-weight: bold;
}

.wait-time span {
  font-size: 0.85rem;
  font-weight: normal;
  color: #aaa;
}

.ll-time {
  color: #64b5f6;
  font-weight: bold;
}

.ll-sold-out {
  color: #ff6b6b;
  font-weight: bold;
}

.showtimes {
  margin-top: 10px;
}

.showtimes-label {
  font-size: 0.75rem;
  color: #aaa;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.showtimes-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.showtime {
  background: rgba(255,255,255,0.15);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
}

.showtime.past {
  opacity: 0.4;
}

.showtime.next {
  background: #4caf50;
  font-weight: bold;
}

.no-results {
  text-align: center;
  padding: 40px;
  color: #aaa;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
}

.history-delete-action {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 100%;
  background: #f44336;
  display: flex;
  align-items: center;
  padding-left: 20px;
  font-weight: bold;
  font-size: 0.9rem;
}

.history-delete-action.ready {
  background: #c62828;
}

.history-item {
  position: relative;
  background: #252542;
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  touch-action: pan-y pinch-zoom;
}

.history-item.swiping {
  transition: none;
}

.history-ride-name {
  font-weight: bold;
}

.history-park {
  font-size: 0.8rem;
  color: #aaa;
}

.history-time {
  text-align: right;
  font-size: 0.85rem;
  color: #aaa;
}

.history-date {
  color: #fff;
  font-weight: bold;
}

.logged-toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #4caf50;
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-weight: bold;
  z-index: 1000;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes toastOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

footer {
  text-align: center;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
  color: #666;
  font-size: 0.85rem;
}

footer a {
  color: #888;
}

.version {
  margin-top: 8px;
  font-size: 0.75rem;
  color: #555;
}

.pull-to-refresh {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 0;
  overflow: hidden;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  z-index: 200;
  transition: height 0.2s ease;
}

.pull-to-refresh.pulling {
  transition: none;
}

.pull-to-refresh.refreshing {
  height: 60px;
}

.pull-indicator {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.2s;
}

.pull-to-refresh.visible .pull-indicator {
  opacity: 1;
}

.pull-arrow {
  font-size: 1.2rem;
  transition: transform 0.2s;
}

.pull-to-refresh.ready .pull-arrow {
  transform: rotate(180deg);
}

.pull-to-refresh.refreshing .pull-arrow {
  display: none;
}

.pull-text {
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.7);
}

.pull-spinner {
  display: none;
  width: 24px;
  height: 24px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
}

.pull-to-refresh.refreshing .pull-spinner {
  display: block;
}
  </style>
</head>
<body>
  <div class="pull-to-refresh" id="pullToRefresh">
    <div class="pull-indicator">
      <span class="pull-arrow">↓</span>
      <span class="pull-spinner"></span>
      <span class="pull-text">Pull to refresh</span>
    </div>
  </div>
  <div class="container">
    <div class="sticky-header">
      <div class="park-toggle" id="parkToggle"></div>
      <div class="entity-tabs" id="entityTabs"></div>
      <div class="filters" id="filters"></div>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Loading rides...</div>
      </div>
    </div>

    <footer>
      Data provided by <a href="https://themeparks.wiki" target="_blank">ThemeParks.wiki</a>
      <div class="version">Version: 2026-01-12 12:00</div>
    </footer>
  </div>

<script type="module">
const API_BASE = 'https://api.themeparks.wiki/v1';
const DISNEYLAND_SLUG = 'disneylandresortcalifornia';

let parks = [];
let currentParkId = null;
let currentEntityType = 'ATTRACTION';
let allEntities = [];
let liveDataMap = new Map();
let showFavoritesOnly = false;

const ENTITY_TYPES = [
  { type: 'ATTRACTION', label: 'Attractions' },
  { type: 'SHOW', label: 'Shows' },
  { type: 'RESTAURANT', label: 'Restaurants' },
  { type: 'HISTORY', label: 'History' }
];

const STORAGE_KEY = 'disneyRideHistory';
const QUEUE_KEY = 'disneyActiveQueues';
const FAVORITES_KEY = 'disneyFavorites';
const SORT_ORDER_KEY = 'disneySortOrder';

function getFavorites() {
  try {
    return JSON.parse(localStorage.getItem(FAVORITES_KEY)) || [];
  } catch {
    return [];
  }
}

function isFavorite(entityId) {
  return getFavorites().includes(entityId);
}

function toggleFavorite(entityId) {
  const favorites = getFavorites();
  const index = favorites.indexOf(entityId);
  if (index === -1) {
    favorites.push(entityId);
  } else {
    favorites.splice(index, 1);
  }
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
  return index === -1;
}

function getSavedSortOrder() {
  return localStorage.getItem(SORT_ORDER_KEY) || 'alpha';
}

function saveSortOrder(order) {
  localStorage.setItem(SORT_ORDER_KEY, order);
}

function getActiveQueues() {
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY)) || {};
  } catch {
    return {};
  }
}

function startQueue(ride, parkName) {
  const queues = getActiveQueues();
  queues[ride.id] = {
    id: ride.id,
    name: ride.name,
    parkName: parkName,
    startTime: new Date().toISOString()
  };
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queues));
  showToast(`Timer started: ${ride.name}`);
}

function endQueue(rideId) {
  const queues = getActiveQueues();
  const queue = queues[rideId];
  delete queues[rideId];
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queues));
  return queue;
}

function isInQueue(rideId) {
  const queues = getActiveQueues();
  return !!queues[rideId];
}

function getQueueStartTime(rideId) {
  const queues = getActiveQueues();
  return queues[rideId]?.startTime;
}

function formatElapsedTime(startTime) {
  const start = new Date(startTime);
  const now = new Date();
  const diff = Math.floor((now - start) / 1000);
  const mins = Math.floor(diff / 60);
  const secs = diff % 60;
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

let queueTimerInterval = null;

function startQueueTimers() {
  if (queueTimerInterval) {
    clearInterval(queueTimerInterval);
  }

  queueTimerInterval = setInterval(() => {
    const timers = document.querySelectorAll('.queue-timer-value');
    timers.forEach(timer => {
      const startTime = timer.dataset.queueStart;
      if (startTime) {
        timer.textContent = formatElapsedTime(startTime);
      }
    });
  }, 1000);
}

function getRideHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function addRideToHistory(ride, parkName) {
  const history = getRideHistory();
  const queue = endQueue(ride.id);

  let actualWaitMins = null;
  if (queue) {
    const start = new Date(queue.startTime);
    const now = new Date();
    actualWaitMins = Math.round((now - start) / 60000);
  }

  history.unshift({
    id: ride.id,
    name: ride.name,
    parkName: parkName,
    timestamp: new Date().toISOString(),
    actualWaitMins: actualWaitMins
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));

  const waitMsg = actualWaitMins !== null ? ` (${actualWaitMins} min wait)` : '';
  showToast(`Logged: ${ride.name}${waitMsg}`);
}

function removeFromHistory(index) {
  const history = getRideHistory();
  const removed = history.splice(index, 1)[0];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  showToast(`Removed: ${removed.name}`);
  renderHistory();
}

function showToast(message) {
  const existing = document.querySelector('.logged-toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'logged-toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

function getCurrentParkName() {
  const park = parks.find(p => p.id === currentParkId);
  return park ? park.name : 'Unknown Park';
}

async function fetchDestinations() {
  const response = await fetch(`${API_BASE}/destinations`);
  if (!response.ok) throw new Error('Failed to fetch destinations');
  return response.json();
}

async function fetchChildren(entityId) {
  const response = await fetch(`${API_BASE}/entity/${entityId}/children`);
  if (!response.ok) throw new Error('Failed to fetch children');
  return response.json();
}

async function fetchLiveData(entityId) {
  const response = await fetch(`${API_BASE}/entity/${entityId}/live`);
  if (!response.ok) throw new Error('Failed to fetch live data');
  return response.json();
}

function getStatusClass(status) {
  const statusMap = {
    'OPERATING': 'status-operating',
    'CLOSED': 'status-closed',
    'DOWN': 'status-down',
    'REFURBISHMENT': 'status-refurbishment'
  };
  return statusMap[status] || 'status-unknown';
}

function formatStatus(status) {
  if (!status) return 'Unknown';
  return status.charAt(0) + status.slice(1).toLowerCase();
}

function formatReturnTime(isoString) {
  const date = new Date(isoString);
  return date.toLocaleTimeString('en-US', {
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  });
}

function renderShowtimes(showtimes) {
  if (!showtimes || showtimes.length === 0) return '';

  const now = new Date();
  let foundNext = false;

  const times = showtimes.map(st => {
    const time = new Date(st.startTime);
    const isPast = time < now;
    let isNext = false;

    if (!isPast && !foundNext) {
      isNext = true;
      foundNext = true;
    }

    const timeStr = time.toLocaleTimeString('en-US', {
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });

    let className = 'showtime';
    if (isPast) className += ' past';
    if (isNext) className += ' next';

    return `<span class="${className}">${timeStr}</span>`;
  });

  return `
    <div class="showtimes">
      <div class="showtimes-label">Showtimes</div>
      <div class="showtimes-list">${times.join('')}</div>
    </div>
  `;
}

function setupSwipeHandlers() {
  const cards = document.querySelectorAll('.card-wrapper');

  cards.forEach(wrapper => {
    const card = wrapper.querySelector('.ride-card');
    const actionLeft = wrapper.querySelector('.card-action-left');
    const actionRight = wrapper.querySelector('.card-action-right');
    const rideId = wrapper.dataset.rideId;
    const inQueue = isInQueue(rideId);

    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function handleStart(e) {
      if (e.type === 'mousedown' && e.button !== 0) return;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      currentX = startX;
      isDragging = true;
      card.classList.add('swiping');

      if (e.type === 'mousedown') {
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);
      }
    }

    function handleMove(e) {
      if (!isDragging) return;
      currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const diff = currentX - startX;
      const percent = Math.abs(diff) / wrapper.offsetWidth;

      card.style.transform = `translateX(${diff}px)`;

      if (diff < 0) {
        // Swiping left - log ride
        if (percent > 0.25) {
          actionLeft.classList.add('ready');
          actionLeft.textContent = 'Release to log';
        } else {
          actionLeft.classList.remove('ready');
          actionLeft.textContent = 'Log ride';
        }
        actionRight.classList.remove('ready');
        actionRight.textContent = inQueue ? 'Cancel timer' : 'Start timer';
      } else if (diff > 0) {
        // Swiping right - join/cancel queue
        if (percent > 0.25) {
          actionRight.classList.add('ready');
          actionRight.textContent = inQueue ? 'Release to cancel' : 'Release to start';
        } else {
          actionRight.classList.remove('ready');
          actionRight.textContent = inQueue ? 'Cancel timer' : 'Start timer';
        }
        actionLeft.classList.remove('ready');
        actionLeft.textContent = 'Log ride';
      }
    }

    function handleEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      card.classList.remove('swiping');

      const diff = currentX - startX;
      const percent = Math.abs(diff) / wrapper.offsetWidth;

      if (percent > 0.25) {
        const ride = allEntities.find(r => r.id === rideId);
        if (ride) {
          if (diff < 0) {
            // Swipe left - log ride
            addRideToHistory(ride, getCurrentParkName());
            renderApp();
            return;
          } else {
            // Swipe right - toggle queue
            if (inQueue) {
              endQueue(rideId);
              showToast(`Timer cancelled: ${ride.name}`);
            } else {
              startQueue(ride, getCurrentParkName());
            }
            renderApp();
            return;
          }
        }
      }

      card.style.transform = '';
      actionLeft.classList.remove('ready');
      actionLeft.textContent = 'Log ride';
      actionRight.classList.remove('ready');
      actionRight.textContent = inQueue ? 'Cancel timer' : 'Start timer';
      currentX = 0;
      startX = 0;

      if (e.type === 'mouseup') {
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseup', handleEnd);
      }
    }

    card.addEventListener('touchstart', handleStart, { passive: true });
    card.addEventListener('touchmove', handleMove, { passive: true });
    card.addEventListener('touchend', handleEnd);
    card.addEventListener('mousedown', handleStart);
  });
}

function setupHistorySwipeHandlers() {
  const items = document.querySelectorAll('.history-wrapper');

  items.forEach(wrapper => {
    const item = wrapper.querySelector('.history-item');
    const action = wrapper.querySelector('.history-delete-action');
    const index = parseInt(wrapper.dataset.index);

    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function handleStart(e) {
      if (e.type === 'mousedown' && e.button !== 0) return;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      currentX = startX;
      isDragging = true;
      item.classList.add('swiping');

      if (e.type === 'mousedown') {
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);
      }
    }

    function handleMove(e) {
      if (!isDragging) return;
      currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const diff = Math.max(0, currentX - startX);
      const percent = diff / wrapper.offsetWidth;

      item.style.transform = `translateX(${diff}px)`;

      if (percent > 0.25) {
        action.classList.add('ready');
        action.textContent = 'Release to remove';
      } else {
        action.classList.remove('ready');
        action.textContent = 'Remove';
      }
    }

    function handleEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      item.classList.remove('swiping');

      const diff = currentX - startX;
      const percent = diff / wrapper.offsetWidth;

      if (percent > 0.25 && diff > 0) {
        removeFromHistory(index);
        return;
      }

      item.style.transform = '';
      action.classList.remove('ready');
      action.textContent = 'Remove';
      currentX = 0;
      startX = 0;

      if (e.type === 'mouseup') {
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseup', handleEnd);
      }
    }

    item.addEventListener('touchstart', handleStart, { passive: true });
    item.addEventListener('touchmove', handleMove, { passive: true });
    item.addEventListener('touchend', handleEnd);
    item.addEventListener('mousedown', handleStart);
  });
}

function renderHistory() {
  const content = document.getElementById('content');
  const history = getRideHistory();

  if (history.length === 0) {
    content.innerHTML = '<div class="no-results">No rides logged yet. Swipe left on a ride to log it.</div>';
    return;
  }

  const formatDate = (iso) => {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };

  const formatTime = (iso) => {
    const d = new Date(iso);
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  };

  content.innerHTML = `
    <div class="history-list">
      ${history.map((item, index) => `
        <div class="history-wrapper" data-index="${index}">
          <div class="history-delete-action">Remove</div>
          <div class="history-item">
            <div>
              <div class="history-ride-name">${item.name}</div>
              <div class="history-park">${item.parkName}${item.actualWaitMins !== null ? ` • ${item.actualWaitMins} min wait` : ''}</div>
            </div>
            <div class="history-time">
              <div class="history-date">${formatDate(item.timestamp)}</div>
              <div>${formatTime(item.timestamp)}</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;

  setupHistorySwipeHandlers();
}

function getParkLabel(name) {
  if (name.includes('California Adventure')) return 'DCA';
  if (name.includes('Disneyland')) return 'DLR';
  return name;
}

function renderParkToggle() {
  const toggle = document.getElementById('parkToggle');
  toggle.innerHTML = `
    ${parks.map(park => `
      <button class="park-btn ${park.id === currentParkId ? 'active' : ''}" data-park-id="${park.id}">
        ${getParkLabel(park.name)}
      </button>
    `).join('')}
    <button class="favorites-filter ${showFavoritesOnly ? 'active' : ''}">★</button>
  `;

  toggle.querySelectorAll('.park-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const parkId = btn.dataset.parkId;
      if (parkId !== currentParkId) {
        currentParkId = parkId;
        loadPark(parkId);
      }
    });
  });

  toggle.querySelector('.favorites-filter').addEventListener('click', () => {
    showFavoritesOnly = !showFavoritesOnly;
    renderParkToggle();
    renderApp();
  });
}

function renderEntityTabs() {
  const tabs = document.getElementById('entityTabs');
  const parkToggle = document.getElementById('parkToggle');

  tabs.innerHTML = ENTITY_TYPES.map(et => `
    <button class="entity-tab ${et.type === currentEntityType ? 'active' : ''}" data-type="${et.type}">
      ${et.label}
    </button>
  `).join('');

  parkToggle.style.display = currentEntityType === 'HISTORY' ? 'none' : 'flex';

  tabs.querySelectorAll('.entity-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      if (type !== currentEntityType) {
        currentEntityType = type;
        renderEntityTabs();
        if (type === 'HISTORY') {
          renderHistory();
        } else {
          renderApp();
        }
      }
    });
  });
}

function showLoading() {
  document.getElementById('content').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading...</div>
    </div>
  `;
}

function renderApp() {
  const filtersContainer = document.getElementById('filters');

  if (currentEntityType === 'HISTORY') {
    filtersContainer.innerHTML = '';
    filtersContainer.style.display = 'none';
    renderHistory();
    return;
  }

  const content = document.getElementById('content');

  const filtered = allEntities.filter(e => e.entityType === currentEntityType);
  const itemsWithLive = filtered.map(item => {
    const live = liveDataMap.get(item.id) || {};
    return {
      ...item,
      status: live.status || 'UNKNOWN',
      waitTime: live.queue?.STANDBY?.waitTime ?? null,
      returnStart: live.queue?.RETURN_TIME?.returnStart ?? null,
      hasLightningLane: !!live.queue?.RETURN_TIME,
      showtimes: live.showtimes || []
    };
  });

  const typeLabel = ENTITY_TYPES.find(t => t.type === currentEntityType)?.label || 'items';

  const savedSort = getSavedSortOrder();
  filtersContainer.style.display = 'flex';
  filtersContainer.innerHTML = `
    <input type="text" id="search" placeholder="Search ${typeLabel.toLowerCase()}..." />
    <select id="sortOrder">
      <option value="alpha" ${savedSort === 'alpha' ? 'selected' : ''}>A-Z</option>
      <option value="wait-low" ${savedSort === 'wait-low' ? 'selected' : ''}>Wait: Low to High</option>
      <option value="wait-high" ${savedSort === 'wait-high' ? 'selected' : ''}>Wait: High to Low</option>
      <option value="ll-early" ${savedSort === 'll-early' ? 'selected' : ''}>LL: Earliest First</option>
      <option value="ll-late" ${savedSort === 'll-late' ? 'selected' : ''}>LL: Latest First</option>
    </select>
  `;

  content.innerHTML = `<div class="rides-grid" id="ridesGrid"></div>`;

  const searchInput = document.getElementById('search');
  const sortOrder = document.getElementById('sortOrder');
  const ridesGrid = document.getElementById('ridesGrid');

  function renderItems() {
    const searchTerm = searchInput.value.toLowerCase();
    const sortValue = sortOrder.value;

    const results = itemsWithLive.filter(item => {
      const matchesSearch = item.name.toLowerCase().includes(searchTerm);
      const matchesFavorites = !showFavoritesOnly || isFavorite(item.id);
      return matchesSearch && matchesFavorites;
    });

    results.sort((a, b) => {
      switch (sortValue) {
        case 'alpha':
          return a.name.localeCompare(b.name);
        case 'wait-low':
          if (a.waitTime === null && b.waitTime === null) return a.name.localeCompare(b.name);
          if (a.waitTime === null) return 1;
          if (b.waitTime === null) return -1;
          return a.waitTime - b.waitTime;
        case 'wait-high':
          if (a.waitTime === null && b.waitTime === null) return a.name.localeCompare(b.name);
          if (a.waitTime === null) return 1;
          if (b.waitTime === null) return -1;
          return b.waitTime - a.waitTime;
        case 'll-early':
          if (!a.returnStart && !b.returnStart) return a.name.localeCompare(b.name);
          if (!a.returnStart) return 1;
          if (!b.returnStart) return -1;
          return new Date(a.returnStart) - new Date(b.returnStart);
        case 'll-late':
          if (!a.returnStart && !b.returnStart) {
            if (a.hasLightningLane && b.hasLightningLane) return a.name.localeCompare(b.name);
            if (a.hasLightningLane) return -1;
            if (b.hasLightningLane) return 1;
            return a.name.localeCompare(b.name);
          }
          if (!a.returnStart) return a.hasLightningLane ? -1 : 1;
          if (!b.returnStart) return b.hasLightningLane ? 1 : -1;
          return new Date(b.returnStart) - new Date(a.returnStart);
        default:
          return a.name.localeCompare(b.name);
      }
    });

    if (results.length === 0) {
      ridesGrid.innerHTML = `<div class="no-results">No ${typeLabel.toLowerCase()} found</div>`;
      return;
    }

    ridesGrid.innerHTML = results.map(item => {
      const inQueue = isInQueue(item.id);
      const queueStart = getQueueStartTime(item.id);
      const favorited = isFavorite(item.id);
      return `
        <div class="card-wrapper" data-ride-id="${item.id}" data-ride-name="${item.name}">
          <div class="card-action card-action-right">Start timer</div>
          <div class="card-action card-action-left">Log ride</div>
          <div class="ride-card ${inQueue ? 'in-queue' : ''}">
            <div class="ride-header">
              <div class="ride-name">${item.name}</div>
              <button class="star-btn ${favorited ? 'favorited' : ''}" data-entity-id="${item.id}">★</button>
            </div>
            <div class="status-row">
              ${item.waitTime !== null ? `<span class="wait-time">${item.waitTime} <span>min</span></span>` : ''}
              ${item.returnStart ? `<span class="ll-time">LL ${formatReturnTime(item.returnStart)}</span>` : (item.hasLightningLane ? `<span class="ll-sold-out">LL SOLD OUT</span>` : '')}
              <span class="ride-status ${getStatusClass(item.status)}">${formatStatus(item.status)}</span>
            </div>
            ${inQueue ? `
              <div class="queue-timer">
                <span class="queue-timer-label">In queue:</span>
                <span class="queue-timer-value" data-queue-start="${queueStart}">${formatElapsedTime(queueStart)}</span>
              </div>
            ` : ''}
            ${renderShowtimes(item.showtimes)}
          </div>
        </div>
      `;
    }).join('');

    setupSwipeHandlers();
    startQueueTimers();

    document.querySelectorAll('.star-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const entityId = btn.dataset.entityId;
        const isNowFavorited = toggleFavorite(entityId);
        btn.classList.toggle('favorited', isNowFavorited);
      });
    });
  }

  searchInput.addEventListener('input', renderItems);
  sortOrder.addEventListener('change', () => {
    saveSortOrder(sortOrder.value);
    renderItems();
  });
  renderItems();
}

function showError(message) {
  document.getElementById('content').innerHTML = `
    <div class="error">${message}</div>
  `;
}

async function loadPark(parkId) {
  showLoading();
  renderParkToggle();
  renderEntityTabs();

  try {
    const [childrenData, liveData] = await Promise.all([
      fetchChildren(parkId),
      fetchLiveData(parkId)
    ]);

    allEntities = childrenData.children;

    liveDataMap = new Map();
    if (liveData.liveData) {
      liveData.liveData.forEach(item => {
        liveDataMap.set(item.id, item);
      });
    }

    renderApp();
  } catch (error) {
    console.error(error);
    showError(`Error loading data: ${error.message}`);
  }
}

async function init() {
  try {
    const destinations = await fetchDestinations();

    const disneylandResort = destinations.destinations.find(d =>
      d.slug === DISNEYLAND_SLUG || d.name.includes('Disneyland Resort')
    );

    if (!disneylandResort) {
      throw new Error('Disneyland Resort not found');
    }

    parks = disneylandResort.parks.filter(p =>
      p.name.includes('Disneyland') || p.name.includes('California Adventure')
    );

    if (parks.length === 0) {
      throw new Error('No parks found');
    }

    currentParkId = parks[0].id;
    loadPark(currentParkId);
  } catch (error) {
    console.error(error);
    showError(`Error loading parks: ${error.message}`);
  }
}

init();

// Pull-to-refresh implementation for PWA
const pullToRefresh = document.getElementById('pullToRefresh');
const pullText = pullToRefresh.querySelector('.pull-text');
let pullStartY = 0;
let isPulling = false;
let isRefreshing = false;
const PULL_THRESHOLD = 80;

async function refreshData() {
  if (isRefreshing) return;
  isRefreshing = true;

  pullToRefresh.classList.remove('pulling', 'ready', 'visible');
  pullToRefresh.classList.add('refreshing');
  pullText.textContent = 'Refreshing...';

  try {
    if (currentEntityType === 'HISTORY') {
      // History doesn't need refresh from API
      renderHistory();
    } else if (currentParkId) {
      const [childrenData, liveData] = await Promise.all([
        fetchChildren(currentParkId),
        fetchLiveData(currentParkId)
      ]);

      allEntities = childrenData.children;

      liveDataMap = new Map();
      if (liveData.liveData) {
        liveData.liveData.forEach(item => {
          liveDataMap.set(item.id, item);
        });
      }

      renderApp();
    }
    showToast('Data refreshed');
  } catch (error) {
    console.error('Refresh failed:', error);
    showToast('Refresh failed');
  }

  pullToRefresh.classList.remove('refreshing');
  pullToRefresh.style.height = '';
  pullText.textContent = 'Pull to refresh';
  isRefreshing = false;
}

function handlePullStart(e) {
  if (isRefreshing) return;
  if (window.scrollY > 0) return;

  const touch = e.touches ? e.touches[0] : e;
  pullStartY = touch.clientY;
  isPulling = true;
  pullToRefresh.classList.add('pulling');
}

function handlePullMove(e) {
  if (!isPulling || isRefreshing) return;
  if (window.scrollY > 0) {
    isPulling = false;
    pullToRefresh.classList.remove('pulling', 'visible', 'ready');
    pullToRefresh.style.height = '';
    return;
  }

  const touch = e.touches ? e.touches[0] : e;
  const pullDistance = Math.max(0, touch.clientY - pullStartY);

  if (pullDistance > 0) {
    e.preventDefault();
    const height = Math.min(pullDistance * 0.5, 100);
    pullToRefresh.style.height = height + 'px';

    if (height > 10) {
      pullToRefresh.classList.add('visible');
    }

    if (pullDistance > PULL_THRESHOLD) {
      pullToRefresh.classList.add('ready');
      pullText.textContent = 'Release to refresh';
    } else {
      pullToRefresh.classList.remove('ready');
      pullText.textContent = 'Pull to refresh';
    }
  }
}

function handlePullEnd() {
  if (!isPulling || isRefreshing) return;
  isPulling = false;
  pullToRefresh.classList.remove('pulling');

  const height = parseInt(pullToRefresh.style.height) || 0;
  if (height > PULL_THRESHOLD * 0.5) {
    refreshData();
  } else {
    pullToRefresh.classList.remove('visible', 'ready');
    pullToRefresh.style.height = '';
    pullText.textContent = 'Pull to refresh';
  }
}

document.addEventListener('touchstart', handlePullStart, { passive: true });
document.addEventListener('touchmove', handlePullMove, { passive: false });
document.addEventListener('touchend', handlePullEnd);

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
