<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Disneyland Resort Rides</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DL Rides">

  <!-- Manifest and Icons -->
  <link rel="manifest" href="manifest.json">

  <!-- QR Code Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">

  <style>
* {
  box-sizing: border-box;
}

body {
  font-family: Helvetica, Arial, sans-serif;
  margin: 0;
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top));
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  padding-left: calc(20px + env(safe-area-inset-left));
  padding-right: calc(20px + env(safe-area-inset-right));
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  min-height: 100vh;
  color: #fff;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

.sticky-header {
  position: sticky;
  top: 0;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  padding-top: calc(12px + env(safe-area-inset-top));
  margin: calc(-20px - env(safe-area-inset-top)) -20px 0 -20px;
  padding-left: 20px;
  padding-right: 20px;
  padding-bottom: 12px;
  margin-bottom: 16px;
  z-index: 100;
}

.park-toggle {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  position: relative;
}

.favorites-filter {
  position: absolute;
  right: 0;
  background: none;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 6px;
  color: rgba(255,255,255,0.6);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  transition: all 0.2s;
}

.favorites-filter:hover {
  border-color: rgba(255,255,255,0.7);
  color: rgba(255,255,255,0.9);
}

.favorites-filter.active {
  background: #fff;
  border-color: #fff;
  color: #1a1a2e;
}

.header-share-btn {
  position: absolute;
  left: 0;
  background: none;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 6px;
  color: rgba(255,255,255,0.6);
  font-size: 1rem;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.header-share-btn:hover {
  border-color: rgba(255,255,255,0.7);
  color: rgba(255,255,255,0.9);
}

.header-share-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.park-btn {
  padding: 8px 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  background: transparent;
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.park-btn:hover {
  border-color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.1);
}

.park-btn.active {
  background: #fff;
  color: #1a1a2e;
  border-color: #fff;
}

.entity-tabs {
  display: flex;
  justify-content: center;
  gap: 5px;
}

.entity-tab {
  padding: 8px 18px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.entity-tab:hover {
  background: rgba(255,255,255,0.2);
  color: #fff;
}

.entity-tab.active {
  background: rgba(255,255,255,0.25);
  color: #fff;
}

.loading {
  text-align: center;
  padding: 40px;
  font-size: 1.2rem;
}

.spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
  margin-bottom: 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.error {
  background: #ff4444;
  padding: 20px;
  border-radius: 8px;
  text-align: center;
}

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.filters input {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  background: rgba(255,255,255,0.1);
  color: #fff;
}

.filters input::placeholder {
  color: rgba(255,255,255,0.5);
}

.filters select {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  background: rgba(255,255,255,0.1);
  color: #fff;
  cursor: pointer;
}

.rides-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.card-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
}

.card-action {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  display: flex;
  align-items: center;
  font-weight: bold;
  font-size: 0.9rem;
  z-index: 1;
}

.card-action-left {
  right: 0;
  justify-content: flex-end;
  padding-right: 20px;
  background: #4caf50;
}

.card-action-left.ready {
  background: #2e7d32;
}

.card-action-right {
  left: 0;
  justify-content: flex-start;
  padding-left: 20px;
  background: #2196f3;
}

.card-action-right.ready {
  background: #1565c0;
}

.ride-card.in-queue {
  border: 2px solid #2196f3;
}

.queue-timer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 6px 10px;
  background: rgba(33, 150, 243, 0.2);
  border-radius: 6px;
  font-size: 0.9rem;
}

.queue-timer-ll {
  background: rgba(76, 175, 80, 0.2);
}

.queue-timer-label {
  color: #64b5f6;
}

.queue-timer-ll .queue-timer-label {
  color: #81c784;
}

.queue-timer-value {
  font-weight: bold;
  font-family: monospace;
  font-size: 1rem;
}

.ride-card {
  position: relative;
  background: #252542;
  border-radius: 12px;
  padding: 20px;
  transition: background 0.2s;
  touch-action: pan-y pinch-zoom;
  z-index: 2;
}

.ride-card.swiping {
  transition: none;
}

.ride-card:hover {
  background: #2d2d4a;
}

.ride-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}

.ride-name {
  font-size: 1.1rem;
  font-weight: bold;
  flex: 1;
}

.star-btn {
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1.5px rgba(255,255,255,0.6);
  transition: color 0.2s, transform 0.2s, -webkit-text-stroke 0.2s;
}

.star-btn:hover {
  -webkit-text-stroke-color: rgba(255,255,255,0.9);
}

.star-btn.favorited {
  color: #fff;
  -webkit-text-stroke: 1.5px #fff;
}

.star-btn:active {
  transform: scale(1.2);
}

.note-btn {
  background: none;
  border: none;
  font-size: 1.6rem;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  opacity: 0.5;
  transition: opacity 0.2s, transform 0.2s;
}

.note-btn:hover {
  opacity: 0.8;
}

.note-btn.has-note {
  opacity: 1;
}

.note-btn:active {
  transform: scale(1.2);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.item-note {
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.8);
  line-height: 1.4;
}

.note-editor {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.note-editor textarea {
  width: 100%;
  min-height: 60px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.3);
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 16px;
  resize: vertical;
}

.note-editor textarea::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

.note-editor-buttons {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.note-editor-btn {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}

.note-editor-btn.save {
  background: #4caf50;
  color: #fff;
}

.note-editor-btn.save:hover {
  background: #43a047;
}

.note-editor-btn.cancel {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

.note-editor-btn.cancel:hover {
  background: rgba(255, 255, 255, 0.25);
}

.ride-status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: bold;
  text-transform: uppercase;
}

.status-operating {
  background: #4caf50;
  color: #fff;
}

.status-closed {
  background: #f44336;
  color: #fff;
}

.status-down {
  background: #ff9800;
  color: #fff;
}

.status-refurbishment {
  background: #9c27b0;
  color: #fff;
}

.status-unknown {
  background: #607d8b;
  color: #fff;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.wait-time {
  font-size: 1.4rem;
  font-weight: bold;
}

.wait-time span {
  font-size: 0.85rem;
  font-weight: normal;
  color: #aaa;
}

.ll-time {
  color: #64b5f6;
  font-weight: bold;
}

.ll-sold-out {
  color: #ff6b6b;
  font-weight: bold;
}

.distance {
  color: #aaa;
  font-size: 0.85rem;
}

.showtimes {
  margin-top: 10px;
}

.showtimes-label {
  font-size: 0.75rem;
  color: #aaa;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.showtimes-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.showtime {
  background: rgba(255,255,255,0.15);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
}

.showtime.past {
  opacity: 0.4;
}

.showtime.next {
  background: #4caf50;
  font-weight: bold;
}

.stale-warning {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: bold;
  background: #ff9800;
  color: #fff;
  text-transform: uppercase;
}

.no-results {
  text-align: center;
  padding: 40px;
  color: #aaa;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-wrapper {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
}

.history-delete-action {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 100%;
  background: #f44336;
  display: flex;
  align-items: center;
  padding-left: 20px;
  font-weight: bold;
  font-size: 0.9rem;
}

.history-delete-action.ready {
  background: #c62828;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.history-title {
  font-size: 1.1rem;
  color: #aaa;
}

.share-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}

.share-btn:hover {
  background: rgba(255, 255, 255, 0.25);
}

.share-btn:active {
  background: rgba(255, 255, 255, 0.3);
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal {
  background: #252542;
  border-radius: 12px;
  padding: 24px;
  max-width: 400px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-title {
  font-size: 1.2rem;
  font-weight: bold;
  margin-bottom: 12px;
}

.modal-text {
  color: #aaa;
  margin-bottom: 16px;
  font-size: 0.95rem;
  line-height: 1.5;
}

.modal-preview {
  background: rgba(0, 0, 0, 0.3);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 16px;
  max-height: 200px;
  overflow-y: auto;
}

.modal-preview-item {
  padding: 6px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 0.9rem;
}

.modal-preview-item:last-child {
  border-bottom: none;
}

.modal-preview-name {
  font-weight: bold;
}

.modal-preview-meta {
  color: #888;
  font-size: 0.8rem;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.modal-btn {
  flex: 1;
  min-width: 100px;
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.modal-btn-primary {
  background: #4caf50;
  color: #fff;
}

.modal-btn-primary:hover {
  background: #43a047;
}

.modal-btn-secondary {
  background: #2196f3;
  color: #fff;
}

.modal-btn-secondary:hover {
  background: #1e88e5;
}

.modal-btn-cancel {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

.modal-btn-cancel:hover {
  background: rgba(255, 255, 255, 0.25);
}

.qr-container {
  display: flex;
  justify-content: center;
  margin: 16px 0;
}

.qr-container img {
  background: #fff;
  padding: 12px;
  border-radius: 8px;
  max-width: calc(100vw - 80px);
  max-height: calc(100vh - 280px);
  object-fit: contain;
}

.qr-scanner-container {
  position: relative;
  width: 100%;
  max-width: 300px;
  margin: 0 auto 16px;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
}

.qr-scanner-container video {
  width: 100%;
  display: block;
}

.qr-scanner-container canvas {
  display: none;
}

.qr-scanner-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
}

.qr-scanner-frame {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border: 2px solid rgba(255, 255, 255, 0.8);
  border-radius: 12px;
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
}

.qr-scanner-frame::before,
.qr-scanner-frame::after {
  content: '';
  position: absolute;
  width: 30px;
  height: 30px;
  border-color: #4caf50;
  border-style: solid;
}

.qr-scanner-frame::before {
  top: -2px;
  left: -2px;
  border-width: 4px 0 0 4px;
  border-radius: 8px 0 0 0;
}

.qr-scanner-frame::after {
  top: -2px;
  right: -2px;
  border-width: 4px 4px 0 0;
  border-radius: 0 8px 0 0;
}

.qr-scanner-corners::before,
.qr-scanner-corners::after {
  content: '';
  position: absolute;
  width: 30px;
  height: 30px;
  border-color: #4caf50;
  border-style: solid;
}

.qr-scanner-corners::before {
  bottom: -2px;
  left: -2px;
  border-width: 0 0 4px 4px;
  border-radius: 0 0 0 8px;
}

.qr-scanner-corners::after {
  bottom: -2px;
  right: -2px;
  border-width: 0 4px 4px 0;
  border-radius: 0 0 8px 0;
}

.qr-scanner-status {
  text-align: center;
  color: #aaa;
  font-size: 0.9rem;
  margin-bottom: 16px;
}

.header-scan-btn {
  position: absolute;
  left: 44px;
  background: none;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 6px;
  color: rgba(255,255,255,0.6);
  font-size: 1rem;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.header-scan-btn:hover {
  border-color: rgba(255,255,255,0.7);
  color: rgba(255,255,255,0.9);
}

.header-scan-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.history-item {
  position: relative;
  background: #252542;
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  touch-action: pan-y pinch-zoom;
}

.history-item.swiping {
  transition: none;
}

.history-ride-name {
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 8px;
}

.history-ll-badge {
  background: #2196f3;
  color: #fff;
  font-size: 0.7rem;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}

.history-park {
  font-size: 0.8rem;
  color: #aaa;
}

.history-time {
  text-align: right;
  font-size: 0.85rem;
  color: #aaa;
}

.history-date {
  color: #fff;
  font-weight: bold;
}

.history-day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #1e1e38;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
  margin-bottom: 4px;
}

.history-day-header:hover {
  background: #262648;
}

.history-day-header.collapsed {
  margin-bottom: 0;
}

.history-day-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.history-day-chevron {
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.6);
  transition: transform 0.2s;
}

.history-day-header.collapsed .history-day-chevron {
  transform: rotate(-90deg);
}

.history-day-date {
  font-weight: bold;
  font-size: 1rem;
}

.history-day-summary {
  color: rgba(255, 255, 255, 0.6);
  font-size: 0.9rem;
}

.history-day-count {
  background: rgba(255, 255, 255, 0.15);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: bold;
}

.history-day-items {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-left: 8px;
  border-left: 2px solid rgba(255, 255, 255, 0.1);
  margin-left: 8px;
  margin-bottom: 12px;
}

.history-day-items.collapsed {
  display: none;
}

.history-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.history-expand-btn {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  border-radius: 6px;
  color: rgba(255, 255, 255, 0.7);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 12px;
  padding: 6px 10px;
  cursor: pointer;
  transition: all 0.2s;
}

.history-expand-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
}

.history-stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 8px;
  margin-bottom: 16px;
}

.history-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.history-stat-value {
  font-size: 1.4rem;
  font-weight: bold;

const API_BASE = 'https://api.themeparks.wiki/v1';

let currentEntityType = 'ATTRACTION';
let allEntities = [];

let showFavoritesOnly = false;
let userLocation = null;

// Geolocation support - fetches location once when called
function updateGeolocation() {
  return new Promise((resolve) => {
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLocation = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };
          resolve(true);
        },
        (error) => {
          console.log('Geolocation error:', error.message);
          resolve(false);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 30000,
          timeout: 10000
        }
      );
    } else {
      resolve(false);
    }
  });
}

// Haversine formula to calculate distance between two coordinates
function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000; // Earth's radius in meters
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Convert meters to feet
function metersToFeet(meters) {
  return meters * 3.28084;
}

// Format distance for display
function formatDistance(entity) {
  if (!userLocation) return null;
  if (!entity.location?.latitude || !entity.location?.longitude) return null;

  const distanceMeters = getDistanceMeters(
    userLocation.latitude,
    userLocation.longitude,
    entity.location.latitude,
    entity.location.longitude
  );

  const distanceFeet = metersToFeet(distanceMeters);
  const oneMileInFeet = 5280;

  if (distanceFeet > oneMileInFeet) {
    return '> 1 mile';
  }

  return `${Math.round(distanceFeet).toLocaleString()} ft`;
}

// Get raw distance in feet for sorting (returns Infinity if no location)
function getDistanceFeet(entity) {
  if (!userLocation) return Infinity;
  if (!entity.location?.latitude || !entity.location?.longitude) return Infinity;

  const distanceMeters = getDistanceMeters(
    userLocation.latitude,
    userLocation.longitude,
    entity.location.latitude,
    entity.location.longitude
  );

  return metersToFeet(distanceMeters);
}

const ENTITY_TYPES = [

  { type: 'RESTAURANT', label: 'Restaurants' },

];

const STORAGE_KEY = 'disneyRideHistory';

const NOTES_KEY = 'disneyNotes';
const HISTORY_COLLAPSED_KEY = 'disneyHistoryCollapsed';
const SHARE_PARAM = 'history';
const NOTES_SHARE_PARAM = 'notes';

// URL-safe base64 encoding/decoding with compression
async function compressData(data) {
  const stream = new Blob([data]).stream();
  const compressedStream = stream.pipeThrough(new CompressionStream('gzip'));
  const chunks = [];
  const reader = compressedStream.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  return new Uint8Array(await new Blob(chunks).arrayBuffer());
}

async function decompressData(compressed) {
  const stream = new Blob([compressed]).stream();
  const decompressedStream = stream.pipeThrough(new DecompressionStream('gzip'));
  const chunks = [];
  const reader = decompressedStream.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  return await new Blob(chunks).text();
}

function uint8ToBase64(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function base64ToUint8(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

async function encodeHistoryToUrl(history) {
  try {
    // Minimize: short keys, only essential fields
    const minimal = history.map(h => ({
      i: h.id,
      n: h.name,
      p: h.parkName,
      t: h.timestamp,
      w: h.actualWaitMins,
      e: h.expectedWaitMins,
      q: h.queueType
    }));
    const json = JSON.stringify(minimal);
    const compressed = await compressData(json);
    const base64 = uint8ToBase64(compressed);
    // Make URL-safe
    return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } catch (e) {
    console.error('Failed to encode history:', e);
    return null;
  }
}

async function decodeHistoryFromUrl(encoded) {
  try {
    let base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) base64 += '=';
    const compressed = base64ToUint8(base64);
    const json = await decompressData(compressed);
    const minimal = JSON.parse(json);
    if (!Array.isArray(minimal)) return null;
    return minimal.filter(item =>
      item && typeof item.i === 'string' &&
      typeof item.n === 'string' &&
      typeof item.t === 'string'
    ).map(item => ({
      id: item.i,
      name: item.n,
      parkName: item.p || 'Unknown park',
      timestamp: item.t,
      actualWaitMins: item.w ?? null,
      expectedWaitMins: item.e ?? null,
      queueType: item.q ?? null
    }));
  } catch (e) {
    console.error('Failed to decode history:', e);
    return null;
  }
}

async function getSharedHistoryFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const encoded = params.get(SHARE_PARAM);
  if (!encoded) return null;
  return await decodeHistoryFromUrl(encoded);
}

async function createShareUrl(history) {
  const encoded = await encodeHistoryToUrl(history);
  if (!encoded) return null;
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set(SHARE_PARAM, encoded);
  return url.toString();
}

function clearShareParam() {
  const url = new URL(window.location.href);
  url.searchParams.delete(SHARE_PARAM);
  url.searchParams.delete(NOTES_SHARE_PARAM);
  window.history.replaceState({}, '', url.toString());
}

// Notes sharing - similar pattern to history
async function encodeNotesToUrl(notes) {
  try {
    // Convert notes object to array format for more efficient encoding
    const notesArray = Object.entries(notes).map(([id, text]) => ({ i: id, t: text }));
    const json = JSON.stringify(notesArray);
    const compressed = await compressData(json);
    const base64 = uint8ToBase64(compressed);
    return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } catch (e) {
    console.error('Failed to encode notes:', e);
    return null;
  }
}

async function decodeNotesFromUrl(encoded) {
  try {
    let base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) base64 += '=';
    const compressed = base64ToUint8(base64);
    const json = await decompressData(compressed);
    const notesArray = JSON.parse(json);
    if (!Array.isArray(notesArray)) return null;
    // Convert back to object format
    const notes = {};
    notesArray.forEach(item => {
      if (item && typeof item.i === 'string' && typeof item.t === 'string') {
        notes[item.i] = item.t;
      }
    });
    return notes;
  } catch (e) {
    console.error('Failed to decode notes:', e);
    return null;
  }
}

async function getSharedNotesFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const encoded = params.get(NOTES_SHARE_PARAM);
  if (!encoded) return null;
  return await decodeNotesFromUrl(encoded);
}

async function createNotesShareUrl(notes) {
  const encoded = await encodeNotesToUrl(notes);
  if (!encoded) return null;
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set(NOTES_SHARE_PARAM, encoded);
  return url.toString();
}

function startQueue(ride, parkName, queueType = 'standby') {
  const queues = getActiveQueues();
  // Get the current live wait time as the "expected" wait
  const liveData = liveDataMap.get(ride.id);
  const expectedWaitMins = liveData?.queue?.STANDBY?.waitTime ?? null;

  queues[ride.id] = {
    id: ride.id,
    name: ride.name,
    parkName: parkName,
    startTime: new Date().toISOString(),
    expectedWaitMins: expectedWaitMins,
    queueType: queueType
  };
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queues));
  const typeLabel = queueType === 'll' ? ' (Lightning Lane)' : '';
  const expectedMsg = expectedWaitMins !== null ? ` (${expectedWaitMins} min posted)` : '';

function formatElapsedTime(startTime) {
  const start = new Date(startTime);
  const now = new Date();
  const diff = Math.floor((now - start) / 1000);
  const mins = Math.floor(diff / 60);
  const secs = diff % 60;
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

let queueTimerInterval = null;

    timers.forEach(timer => {
      const startTime = timer.dataset.queueStart;

function getRideHistory() {

    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

}

function addRideToHistory(ride, parkName) {
  const history = getRideHistory();
  const queue = endQueue(ride.id);

  let actualWaitMins = null;
  let expectedWaitMins = null;
  let queueType = null;
  if (queue) {
    const start = new Date(queue.startTime);
    const now = new Date();
    actualWaitMins = Math.round((now - start) / 60000);
    expectedWaitMins = queue.expectedWaitMins ?? null;
    queueType = queue.queueType ?? null;
  }

  history.unshift({
    id: ride.id,
    name: ride.name,
    parkName: parkName,
    timestamp: new Date().toISOString(),
    actualWaitMins: actualWaitMins,
    expectedWaitMins: expectedWaitMins,
    queueType: queueType
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));

  let waitMsg = '';
  if (actualWaitMins !== null && expectedWaitMins !== null) {
    waitMsg = ` (${actualWaitMins} min actual, ${expectedWaitMins} min posted)`;
  } else if (actualWaitMins !== null) {
    waitMsg = ` (${actualWaitMins} min wait)`;
  }
  const llMsg = queueType === 'll' ? ' [LL]' : '';
  showToast(`Logged: ${ride.name}${llMsg}${waitMsg}`);
}

function removeFromHistory(index) {

  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));

  const toast = document.createElement('div');

function getStatusClass(status) {
  const statusMap = {
    'OPERATING': 'status-operating',
    'CLOSED': 'status-closed',
    'DOWN': 'status-down',
    'REFURBISHMENT': 'status-refurbishment'
  };
  return statusMap[status] || 'status-unknown';
}

function formatStatus(status) {
  if (!status) return 'Unknown';
  return status.charAt(0) + status.slice(1).toLowerCase();
}

function formatReturnTime(isoString) {
  const date = new Date(isoString);
  return date.toLocaleTimeString('en-US', {
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  });
}

function isDataStale(lastUpdated) {
  if (!lastUpdated) return false;
  const updated = new Date(lastUpdated);
  const now = new Date();
  const diffMs = now - updated;
  const oneHourMs = 60 * 60 * 1000;
  return diffMs > oneHourMs;
}

function renderShowtimes(showtimes) {
  if (!showtimes || showtimes.length === 0) return '';

  const now = new Date();
  let foundNext = false;

  const times = showtimes.map(st => {
    const time = new Date(st.startTime);
    const isPast = time < now;
    let isNext = false;

    if (!isPast && !foundNext) {
      isNext = true;
      foundNext = true;
    }

    const timeStr = time.toLocaleTimeString('en-US', {
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });

    let className = 'showtime';
    if (isPast) className += ' past';
    if (isNext) className += ' next';

    return `<span class="${className}">${timeStr}</span>`;
  });

  return `
    <div class="showtimes">
      <div class="showtimes-label">Showtimes</div>
      <div class="showtimes-list">${times.join('')}</div>
    </div>
  `;
}

function setupSwipeHandlers() {
  const cards = document.querySelectorAll('.card-wrapper');

  cards.forEach(wrapper => {
    const card = wrapper.querySelector('.ride-card');
    const actionLeft = wrapper.querySelector('.card-action-left');
    const actionRight = wrapper.querySelector('.card-action-right');
    const rideId = wrapper.dataset.rideId;
    const inQueue = isInQueue(rideId);

    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function handleStart(e) {
      if (e.type === 'mousedown' && e.button !== 0) return;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      currentX = startX;
      isDragging = true;
      card.classList.add('swiping');

      if (e.type === 'mousedown') {
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);
      }
    }

    function handleMove(e) {
      if (!isDragging) return;
      currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const diff = currentX - startX;
      const percent = Math.abs(diff) / wrapper.offsetWidth;

      card.style.transform = `translateX(${diff}px)`;

      if (diff < 0) {
        // Swiping left
        if (inQueue) {
          // Timer running: swipe left to log
          if (percent > 0.25) {
            actionLeft.classList.add('ready');
            actionLeft.textContent = 'Release to log';
          } else {
            actionLeft.classList.remove('ready');
            actionLeft.textContent = 'Log ride';
          }
        } else {
          // Timer not running: swipe left to start timer
          if (percent > 0.25) {
            actionLeft.classList.add('ready');
            actionLeft.textContent = 'Release to start';
          } else {
            actionLeft.classList.remove('ready');
            actionLeft.textContent = 'Start timer';
          }
        }
        actionRight.classList.remove('ready');
        actionRight.textContent = inQueue ? 'Cancel timer' : '';
      } else if (diff > 0) {
        // Swiping right - only active when timer is running
        if (inQueue) {
          if (percent > 0.25) {
            actionRight.classList.add('ready');
            actionRight.textContent = 'Release to cancel';
          } else {
            actionRight.classList.remove('ready');
            actionRight.textContent = 'Cancel timer';
          }
        }
        actionLeft.classList.remove('ready');
        actionLeft.textContent = inQueue ? 'Log ride' : 'Start timer';
      }
    }

    function handleEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      card.classList.remove('swiping');

      const diff = currentX - startX;
      const percent = Math.abs(diff) / wrapper.offsetWidth;

      if (percent > 0.25) {
        const ride = allEntities.find(r => r.id === rideId);
        if (ride) {
          if (diff < 0) {
            // Swipe left
            if (inQueue) {
              // Timer running: log ride (stops timer and logs)
              addRideToHistory(ride, getCurrentParkName());
              renderApp();
            } else {
              // Timer not running: start timer
              // Check if ride has Lightning Lane - if so, ask which queue type
              const liveData = liveDataMap.get(ride.id);
              const hasLL = !!liveData?.queue?.RETURN_TIME;
              if (hasLL) {
                showQueueTypeModal(ride, getCurrentParkName(), (queueType) => {
                  startQueue(ride, getCurrentParkName(), queueType);
                  renderApp();
                });
              } else {
                startQueue(ride, getCurrentParkName(), 'standby');
                renderApp();
              }
            }
            return;
          } else if (inQueue) {
            // Swipe right - only active when timer is running (cancel timer)
            endQueue(rideId);
            showToast(`Timer cancelled: ${ride.name}`);
            renderApp();
            return;
          }
        }
      }

      card.style.transform = '';
      actionLeft.classList.remove('ready');
      actionLeft.textContent = inQueue ? 'Log ride' : 'Start timer';
      actionRight.classList.remove('ready');
      actionRight.textContent = inQueue ? 'Cancel timer' : '';
      currentX = 0;
      startX = 0;

      if (e.type === 'mouseup') {
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseup', handleEnd);
      }
    }

    card.addEventListener('touchstart', handleStart, { passive: true });
    card.addEventListener('touchmove', handleMove, { passive: true });
    card.addEventListener('touchend', handleEnd);
    card.addEventListener('mousedown', handleStart);
  });
}

function setupHistorySwipeHandlers() {
  const items = document.querySelectorAll('.history-wrapper');

  items.forEach(wrapper => {
    const item = wrapper.querySelector('.history-item');
    const action = wrapper.querySelector('.history-delete-action');
    const index = parseInt(wrapper.dataset.index);

    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function handleStart(e) {
      if (e.type === 'mousedown' && e.button !== 0) return;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      currentX = startX;
      isDragging = true;
      item.classList.add('swiping');

      if (e.type === 'mousedown') {
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);
      }
    }

    function handleMove(e) {
      if (!isDragging) return;
      currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const diff = Math.max(0, currentX - startX);
      const percent = diff / wrapper.offsetWidth;

      item.style.transform = `translateX(${diff}px)`;

      if (percent > 0.25) {
        action.classList.add('ready');
        action.textContent = 'Release to remove';
      } else {
        action.classList.remove('ready');
        action.textContent = 'Remove';
      }
    }

    function handleEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      item.classList.remove('swiping');

      const diff = currentX - startX;
      const percent = diff / wrapper.offsetWidth;

      if (percent > 0.25 && diff > 0) {
        removeFromHistory(index);
        return;
      }

      item.style.transform = '';
      action.classList.remove('ready');
      action.textContent = 'Remove';
      currentX = 0;
      startX = 0;

      if (e.type === 'mouseup') {
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseup', handleEnd);
      }
    }

    item.addEventListener('touchstart', handleStart, { passive: true });
    item.addEventListener('touchmove', handleMove, { passive: true });
    item.addEventListener('touchend', handleEnd);
    item.addEventListener('mousedown', handleStart);
  });
}

function renderHistory() {
  const content = document.getElementById('content');
  const history = getRideHistory();

  if (history.length === 0) {
    content.innerHTML = '<div class="no-results">No rides logged yet. Start a timer, then swipe left to log when done.</div>';
    return;
  }

  const formatDateHeader = (iso) => {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };

  const formatTime = (iso) => {
    const d = new Date(iso);
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  };

  const getDateKey = (iso) => {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
  };

  const todayKey = getDateKey(new Date().toISOString());

  // Group history by day
  const dayGroups = new Map();
  history.forEach((item, index) => {
    const dateKey = getDateKey(item.timestamp);
    if (!dayGroups.has(dateKey)) {
      dayGroups.set(dateKey, { items: [], indices: [] });
    }
    dayGroups.get(dateKey).items.push(item);
    dayGroups.get(dateKey).indices.push(index);
  });

  // Calculate overall stats
  const totalRides = history.length;
  const uniqueDays = dayGroups.size;
  const dlrCount = history.filter(h => h.parkName && h.parkName.includes('Disneyland') && !h.parkName.includes('California Adventure')).length;
  const dcaCount = history.filter(h => h.parkName && h.parkName.includes('California Adventure')).length;
  const llCount = history.filter(h => h.queueType === 'll').length;
  const withWaitTime = history.filter(h => h.actualWaitMins !== null);
  const avgWait = withWaitTime.length > 0
    ? Math.round(withWaitTime.reduce((sum, h) => sum + h.actualWaitMins, 0) / withWaitTime.length)
    : null;

  // Build HTML for day groups
  const dayGroupsHtml = Array.from(dayGroups.entries()).map(([dateKey, group]) => {
    const isToday = dateKey === todayKey;
    const collapsed = isDayCollapsed(dateKey, isToday);
    const dateDisplay = formatDateHeader(group.items[0].timestamp);

    // Count parks for this day
    const dayDlr = group.items.filter(h => h.parkName && h.parkName.includes('Disneyland') && !h.parkName.includes('California Adventure')).length;
    const dayDca = group.items.filter(h => h.parkName && h.parkName.includes('California Adventure')).length;

    let parkSummary = '';
    if (dayDlr > 0 && dayDca > 0) {
      parkSummary = `${dayDlr} DLR, ${dayDca} DCA`;
    } else if (dayDlr > 0) {
      parkSummary = `${dayDlr} DLR`;
    } else if (dayDca > 0) {
      parkSummary = `${dayDca} DCA`;
    }

    const itemsHtml = group.items.map((item, i) => {
      const globalIndex = group.indices[i];
      let waitInfo = '';
      if (item.actualWaitMins !== null && item.expectedWaitMins !== null) {
        waitInfo = ` • ${item.actualWaitMins} min (posted ${item.expectedWaitMins})`;
      } else if (item.actualWaitMins !== null) {
        waitInfo = ` • ${item.actualWaitMins} min wait`;
      }
      const llBadge = item.queueType === 'll' ? '<span class="history-ll-badge">LL</span>' : '';
      return `
        <div class="history-wrapper" data-index="${globalIndex}">
          <div class="history-delete-action">Remove</div>
          <div class="history-item">
            <div>
              <div class="history-ride-name"><span>${item.name}</span>${llBadge}</div>
              <div class="history-park">${item.parkName}${waitInfo}</div>
            </div>
            <div class="history-time">
              <div>${formatTime(item.timestamp)}</div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="history-day-header ${collapsed ? 'collapsed' : ''}" data-date-key="${dateKey}" data-is-today="${isToday}">
        <div class="history-day-left">
          <span class="history-day-chevron">&#9660;</span>
          <span class="history-day-date">${isToday ? 'Today' : dateDisplay}</span>
          <span class="history-day-summary">${parkSummary}</span>
        </div>
        <span class="history-day-count">${group.items.length}</span>
      </div>
      <div class="history-day-items ${collapsed ? 'collapsed' : ''}" data-date-key="${dateKey}">
        ${itemsHtml}
      </div>
    `;
  }).join('');

  content.innerHTML = `
    <div class="history-header">
      <span class="history-title">${history.length} ride${history.length !== 1 ? 's' : ''} logged</span>
      <div class="history-controls">
        <button class="history-expand-btn" id="expandAllBtn">Expand All</button>
        <button class="history-expand-btn" id="collapseAllBtn">Collapse All</button>
        <button class="share-btn" id="scanQRBtn" title="Scan QR">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle;"><path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM19 13h-1.5v1.5H19V13z"/></svg>
        </button>
        <button class="share-btn" id="shareHistoryBtn">
          <span>Share</span>
        </button>
      </div>
    </div>
    <div class="history-stats">
      <div class="history-stat">
        <span class="history-stat-value">${totalRides}</span>
        <span class="history-stat-label">Total</span>
      </div>
      <div class="history-stat">
        <span class="history-stat-value">${uniqueDays}</span>
        <span class="history-stat-label">Days</span>
      </div>
      ${dlrCount > 0 ? `
      <div class="history-stat">
        <span class="history-stat-value">${dlrCount}</span>
        <span class="history-stat-label">DLR</span>
      </div>
      ` : ''}
      ${dcaCount > 0 ? `
      <div class="history-stat">
        <span class="history-stat-value">${dcaCount}</span>
        <span class="history-stat-label">DCA</span>
      </div>
      ` : ''}
      ${llCount > 0 ? `
      <div class="history-stat">
        <span class="history-stat-value">${llCount}</span>
        <span class="history-stat-label">LL</span>
      </div>
      ` : ''}
      ${avgWait !== null ? `
      <div class="history-stat">
        <span class="history-stat-value">${avgWait}</span>
        <span class="history-stat-label">Avg Wait</span>
      </div>
      ` : ''}
    </div>
    <div class="history-list">
      ${dayGroupsHtml}
    </div>
  `;

  setupHistorySwipeHandlers();

  // Setup day header click handlers
  document.querySelectorAll('.history-day-header').forEach(header => {
    header.addEventListener('click', () => {
      const dateKey = header.dataset.dateKey;
      const itemsDiv = document.querySelector(`.history-day-items[data-date-key="${dateKey}"]`);
      const isNowCollapsed = !header.classList.contains('collapsed');

      header.classList.toggle('collapsed', isNowCollapsed);
      itemsDiv.classList.toggle('collapsed', isNowCollapsed);
      setDayCollapsed(dateKey, isNowCollapsed);
    });
  });

  // Expand All button
  document.getElementById('expandAllBtn').addEventListener('click', () => {
    document.querySelectorAll('.history-day-header').forEach(header => {
      const dateKey = header.dataset.dateKey;
      const itemsDiv = document.querySelector(`.history-day-items[data-date-key="${dateKey}"]`);
      header.classList.remove('collapsed');
      itemsDiv.classList.remove('collapsed');
      setDayCollapsed(dateKey, false);
    });
  });

  // Collapse All button
  document.getElementById('collapseAllBtn').addEventListener('click', () => {
    document.querySelectorAll('.history-day-header').forEach(header => {
      const dateKey = header.dataset.dateKey;
      const itemsDiv = document.querySelector(`.history-day-items[data-date-key="${dateKey}"]`);
      header.classList.add('collapsed');
      itemsDiv.classList.add('collapsed');
      setDayCollapsed(dateKey, true);
    });
  });

  document.getElementById('shareHistoryBtn').addEventListener('click', () => showShareMethodModal('history'));
  document.getElementById('scanQRBtn').addEventListener('click', showQRScanner);
}

async function shareHistory() {
  const history = getRideHistory();
  if (history.length === 0) {
    showToast('No history to share');
    return;
  }

  const shareUrl = await createShareUrl(history);
  if (!shareUrl) {
    showToast('Failed to create share link');
    return;
  }

  // Try native share API first (mobile)
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'My Disneyland Ride History',
        text: `Check out my ${history.length} ride${history.length !== 1 ? 's' : ''} at Disneyland!\n${shareUrl}`
      });
      return;
    } catch (e) {
      // User cancelled or share failed, fall back to clipboard
      if (e.name === 'AbortError') return;
    }
  }

  // Fall back to clipboard
  try {
    await navigator.clipboard.writeText(shareUrl);
    showToast('Link copied to clipboard!');
  } catch (e) {
    // Final fallback: show modal with URL
    showShareModal(shareUrl);
  }
}

async function showQRCodeModal(type) {
  const typeLabel = type === 'notes' ? 'Notes' : 'History';
  let encoded;

  if (type === 'notes') {
    const notes = getNotes();
    encoded = await encodeNotesToUrl(notes);
  } else {
    const history = getRideHistory();
    encoded = await encodeHistoryToUrl(history);
  }

  if (!encoded) {
    showToast('Failed to generate QR code');
    return;
  }

  // QR data format: type prefix + encoded data
  const qrData = (type === 'notes' ? 'N:' : 'H:') + encoded;

  // Check data size - QR codes have limits
  if (qrData.length > 2000) {
    showToast('Too much data for QR code. Try sharing fewer items.');
    return;
  }

  // Generate QR code
  let qrImageUrl;
  try {
    const qr = qrcode(0, 'M');
    qr.addData(qrData);
    qr.make();
    qrImageUrl = qr.createDataURL(6, 4);
  } catch (e) {
    console.error('QR generation error:', e);
    showToast('Failed to generate QR code');
    return;
  }

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-title">Share ${typeLabel}</div>
      <div class="modal-text">Have the other person scan this QR code with their Disneyland app.</div>
      <div class="qr-container">
        <img src="${qrImageUrl}" alt="QR Code">
      </div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" id="closeQRModal">Done</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  modal.addEventListener('click', (e) => {
    if (e.target === modal || e.target.id === 'closeQRModal') {
      modal.remove();
    }
  });
}

let qrScannerStream = null;
let qrScannerAnimationId = null;

async function showQRScanner() {
  // Check if BarcodeDetector is available
  const hasBarcodeDetector = 'BarcodeDetector' in window;

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'qrScannerModal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-title">Scan QR Code</div>
      <div class="modal-text">Point your camera at a QR code to import shared data.</div>
      <div class="qr-scanner-container">
        <video id="qrVideo" autoplay playsinline muted></video>
        <canvas id="qrCanvas"></canvas>
        <div class="qr-scanner-overlay">
          <div class="qr-scanner-frame">
            <div class="qr-scanner-corners"></div>
          </div>
        </div>
      </div>
      <div class="qr-scanner-status" id="qrScannerStatus">Initializing camera...</div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" id="closeQRScanner">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const video = document.getElementById('qrVideo');
  const canvas = document.getElementById('qrCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusEl = document.getElementById('qrScannerStatus');

  const closeScanner = () => {
    if (qrScannerAnimationId) {
      cancelAnimationFrame(qrScannerAnimationId);
      qrScannerAnimationId = null;
    }
    if (qrScannerStream) {
      qrScannerStream.getTracks().forEach(track => track.stop());
      qrScannerStream = null;
    }
    modal.remove();
  };

  document.getElementById('closeQRScanner').addEventListener('click', closeScanner);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeScanner();
    }
  });

  try {
    qrScannerStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = qrScannerStream;
    await video.play();

    statusEl.textContent = 'Scanning...';

    // Set canvas size to match video
    video.addEventListener('loadedmetadata', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    });

    let barcodeDetector = null;
    if (hasBarcodeDetector) {
      try {
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) {
        console.log('BarcodeDetector not supported, will use fallback');
      }
    }

    const scanFrame = async () => {
      if (!qrScannerStream) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        try {
          let result = null;

          // Try BarcodeDetector first (native, faster)
          if (barcodeDetector) {
            const barcodes = await barcodeDetector.detect(canvas);
            if (barcodes.length > 0) {
              result = barcodes[0].rawValue;
            }
          }

          // Fallback to jsQR library
          if (!result && typeof jsQR !== 'undefined') {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, canvas.width, canvas.height, {
              inversionAttempts: 'dontInvert'
            });
            if (code) {
              result = code.data;
            }
          }

          if (result) {
            closeScanner();
            await processQRData(result);
            return;
          }
        } catch (e) {
          console.error('Scan error:', e);
        }
      }

      qrScannerAnimationId = requestAnimationFrame(scanFrame);
    };

    scanFrame();

  } catch (e) {
    console.error('Camera error:', e);
    statusEl.textContent = 'Camera access denied. Please allow camera access and try again.';
  }
}

async function processQRData(data) {
  // Parse QR data format: "N:" for notes, "H:" for history
  if (!data || data.length < 3) {
    showToast('Invalid QR code');
    return;
  }

  const type = data.substring(0, 2);
  const encoded = data.substring(2);

  if (type === 'N:') {
    // Decode notes
    const notes = await decodeNotesFromUrl(encoded);
    if (!notes || Object.keys(notes).length === 0) {
      showToast('Could not read notes from QR code');
      return;
    }

    // Build entity names map for display
    const entityNames = {};
    Object.keys(notes).forEach(id => {
      const entity = allEntities.find(e => e.id === id);
      entityNames[id] = entity ? entity.name : id;
    });

    showNotesImportModal(notes, entityNames);

  } else if (type === 'H:') {
    // Decode history
    const history = await decodeHistoryFromUrl(encoded);
    if (!history || history.length === 0) {
      showToast('Could not read history from QR code');
      return;
    }

    showImportModal(history);

  } else {
    showToast('Unknown QR code format');
  }
}

async function shareNotes() {
  const notes = getNotes();
  const notesCount = Object.keys(notes).length;

  if (notesCount === 0) {
    showToast('No notes to share');
    return;
  }

  const shareUrl = await createNotesShareUrl(notes);
  if (!shareUrl) {
    showToast('Failed to create share link');
    return;
  }

  // Try native share API first (mobile)
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'My Disneyland Notes',
        text: `Check out my ${notesCount} note${notesCount !== 1 ? 's' : ''} for Disneyland!\n${shareUrl}`
      });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }

  // Fall back to clipboard
  try {
    await navigator.clipboard.writeText(shareUrl);
    showToast('Link copied to clipboard!');
  } catch (e) {
    showShareModal(shareUrl, 'notes');
  }
}

function showNotesImportModal(sharedNotes, entityNames) {
  const existingNotes = getNotes();
  const sharedIds = Object.keys(sharedNotes);
  const existingIds = Object.keys(existingNotes);
  const hasExisting = existingIds.length > 0;

  // Find conflicts (items that exist in both)
  const conflictIds = sharedIds.filter(id => existingIds.includes(id) && existingNotes[id] !== sharedNotes[id]);
  const newIds = sharedIds.filter(id => !existingIds.includes(id));

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-title">Import Shared Notes</div>
      <div class="modal-text">
        Someone shared ${sharedIds.length} note${sharedIds.length !== 1 ? 's' : ''} with you.
        ${hasExisting ? `You currently have ${existingIds.length} note${existingIds.length !== 1 ? 's' : ''}.` : ''}
        ${conflictIds.length > 0 ? `<br><br><strong>${conflictIds.length} item${conflictIds.length !== 1 ? 's have' : ' has'} different notes</strong> - you can choose how to handle conflicts.` : ''}
      </div>
      <div class="modal-preview">
        ${sharedIds.slice(0, 10).map(id => {
          const name = entityNames[id] || id;
          const hasConflict = conflictIds.includes(id);
          return `
            <div class="modal-preview-item">
              <div class="modal-preview-name">${escapeHtml(name)}${hasConflict ? ' <span style="background:#ff9800;color:#fff;font-size:0.65rem;padding:1px 4px;border-radius:3px;">CONFLICT</span>' : ''}</div>

      </div>
      <div class="modal-buttons" style="flex-direction: column; gap: 8px;">
        ${conflictIds.length > 0 ? `
          <button class="modal-btn modal-btn-primary" id="mergeKeepMineBtn">Merge (keep my notes for conflicts)</button>
          <button class="modal-btn modal-btn-secondary" id="mergeUseSharedBtn">Merge (use shared notes for conflicts)</button>
        ` : `
          <button class="modal-btn modal-btn-primary" id="mergeNotesBtn">Add to My Notes</button>
        `}
        ${hasExisting ? `<button class="modal-btn modal-btn-cancel" id="replaceNotesBtn" style="background: #f44336;">Replace All My Notes</button>` : ''}
        <button class="modal-btn modal-btn-cancel" id="cancelNotesImportBtn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  if (conflictIds.length > 0) {
    document.getElementById('mergeKeepMineBtn').addEventListener('click', () => {
      mergeNotes(sharedNotes, 'keep-mine');
      modal.remove();
      clearShareParam();
      showToast('Notes merged (kept your versions)!');
      renderApp();
    });

    document.getElementById('mergeUseSharedBtn').addEventListener('click', () => {
      mergeNotes(sharedNotes, 'use-shared');
      modal.remove();
      clearShareParam();
      showToast('Notes merged (used shared versions)!');
      renderApp();
    });
  } else {
    document.getElementById('mergeNotesBtn').addEventListener('click', () => {
      mergeNotes(sharedNotes, 'keep-mine');
      modal.remove();
      clearShareParam();
      showToast('Notes added!');
      renderApp();
    });
  }

  if (hasExisting) {
    document.getElementById('replaceNotesBtn').addEventListener('click', () => {
      localStorage.setItem(NOTES_KEY, JSON.stringify(sharedNotes));
      modal.remove();
      clearShareParam();
      showToast('Notes replaced!');
      renderApp();
    });
  }

  document.getElementById('cancelNotesImportBtn').addEventListener('click', () => {
    modal.remove();
    clearShareParam();
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.remove();
      clearShareParam();
    }
  });
}

function mergeNotes(sharedNotes, conflictStrategy) {
  const existing = getNotes();
  const merged = { ...existing };

  Object.entries(sharedNotes).forEach(([id, text]) => {
    if (!(id in existing)) {
      // New note, just add it
      merged[id] = text;
    } else if (existing[id] !== text) {
      // Conflict - use strategy
      if (conflictStrategy === 'use-shared') {
        merged[id] = text;
      }
      // 'keep-mine' means we do nothing (keep existing)
    }
  });

  localStorage.setItem(NOTES_KEY, JSON.stringify(merged));
}

function renderApp() {
  const filtersContainer = document.getElementById('filters');

  if (currentEntityType === 'HISTORY') {
    filtersContainer.innerHTML = '';
    filtersContainer.style.display = 'none';
    renderHistory();
    return;
  }

  const content = document.getElementById('content');

  const filtered = allEntities.filter(e => e.entityType === currentEntityType);
  const itemsWithLive = filtered.map(item => {
    const live = liveDataMap.get(item.id) || {};
    return {
      ...item,
      status: live.status || 'UNKNOWN',
      waitTime: live.queue?.STANDBY?.waitTime ?? null,
      returnStart: live.queue?.RETURN_TIME?.returnStart ?? null,
      hasLightningLane: !!live.queue?.RETURN_TIME,
      showtimes: live.showtimes || [],
      lastUpdated: live.lastUpdated || null,
      location: item.location || null
    };
  });

  const typeLabel = ENTITY_TYPES.find(t => t.type === currentEntityType)?.label || 'items';

  const savedSort = getSavedSortOrder();
  filtersContainer.style.display = 'flex';
  filtersContainer.innerHTML = `
    <input type="text" id="search" placeholder="Search ${typeLabel.toLowerCase()}..." />
    <select id="sortOrder">
      <option value="alpha" ${savedSort === 'alpha' ? 'selected' : ''}>A-Z</option>
      <option value="closest" ${savedSort === 'closest' ? 'selected' : ''}>Closest</option>
      <option value="wait-low" ${savedSort === 'wait-low' ? 'selected' : ''}>Wait: Low to High</option>
      <option value="wait-high" ${savedSort === 'wait-high' ? 'selected' : ''}>Wait: High to Low</option>
      <option value="ll-early" ${savedSort === 'll-early' ? 'selected' : ''}>LL: Earliest First</option>
      <option value="ll-late" ${savedSort === 'll-late' ? 'selected' : ''}>LL: Latest First</option>
    </select>
  `;

  content.innerHTML = `<div class="rides-grid" id="ridesGrid"></div>`;

  const searchInput = document.getElementById('search');
  const sortOrder = document.getElementById('sortOrder');
  const ridesGrid = document.getElementById('ridesGrid');

  function renderItems() {
    const searchTerm = searchInput.value.toLowerCase();
    const sortValue = sortOrder.value;

    const results = itemsWithLive.filter(item => {
      const matchesSearch = item.name.toLowerCase().includes(searchTerm);
      const matchesFavorites = !showFavoritesOnly || isFavorite(item.id);
      return matchesSearch && matchesFavorites;
    });

    results.sort((a, b) => {
      switch (sortValue) {
        case 'alpha':
          return a.name.localeCompare(b.name);
        case 'closest':
          const distA = getDistanceFeet(a);
          const distB = getDistanceFeet(b);
          if (distA === distB) return a.name.localeCompare(b.name);
          return distA - distB;
        case 'wait-low':
          if (a.waitTime === null && b.waitTime === null) return a.name.localeCompare(b.name);
          if (a.waitTime === null) return 1;
          if (b.waitTime === null) return -1;
          return a.waitTime - b.waitTime;
        case 'wait-high':
          if (a.waitTime === null && b.waitTime === null) return a.name.localeCompare(b.name);
          if (a.waitTime === null) return 1;
          if (b.waitTime === null) return -1;
          return b.waitTime - a.waitTime;
        case 'll-early':
          if (!a.returnStart && !b.returnStart) return a.name.localeCompare(b.name);
          if (!a.returnStart) return 1;
          if (!b.returnStart) return -1;
          return new Date(a.returnStart) - new Date(b.returnStart);
        case 'll-late':
          if (!a.returnStart && !b.returnStart) {
            if (a.hasLightningLane && b.hasLightningLane) return a.name.localeCompare(b.name);
            if (a.hasLightningLane) return -1;
            if (b.hasLightningLane) return 1;
            return a.name.localeCompare(b.name);
          }
          if (!a.returnStart) return a.hasLightningLane ? -1 : 1;
          if (!b.returnStart) return b.hasLightningLane ? 1 : -1;
          return new Date(b.returnStart) - new Date(a.returnStart);
        default:
          return a.name.localeCompare(b.name);
      }
    });

    if (results.length === 0) {
      ridesGrid.innerHTML = `<div class="no-results">No ${typeLabel.toLowerCase()} found</div>`;
      return;
    }

    ridesGrid.innerHTML = results.map(item => {
      const inQueue = isInQueue(item.id);
      const queueStart = getQueueStartTime(item.id);
      const queueType = getQueueType(item.id);
      const favorited = isFavorite(item.id);
      const note = getNote(item.id);
      const hasNote = note.length > 0;
      const distance = formatDistance(item);
      return `
        <div class="card-wrapper" data-ride-id="${item.id}" data-ride-name="${item.name}">
          <div class="card-action card-action-right">${inQueue ? 'Cancel timer' : ''}</div>
          <div class="card-action card-action-left">${inQueue ? 'Log ride' : 'Start timer'}</div>
          <div class="ride-card ${inQueue ? 'in-queue' : ''}">
            <div class="ride-header">
              <div class="ride-name">${item.name}</div>
              <div class="header-actions">
                <button class="note-btn ${hasNote ? 'has-note' : ''}" data-entity-id="${item.id}" title="Add note">&#9998;</button>
                <button class="star-btn ${favorited ? 'favorited' : ''}" data-entity-id="${item.id}">★</button>
              </div>
            </div>
            <div class="status-row">
              ${item.waitTime !== null ? `<span class="wait-time">${item.waitTime} <span>min</span></span>` : ''}
              ${item.returnStart ? `<span class="ll-time">LL ${formatReturnTime(item.returnStart)}</span>` : (item.hasLightningLane ? `<span class="ll-sold-out">LL SOLD OUT</span>` : '')}
              <span class="ride-status ${getStatusClass(item.status)}">${formatStatus(item.status)}</span>
              ${isDataStale(item.lastUpdated) ? '<span class="stale-warning">Stale</span>' : ''}
              ${distance ? `<span class="distance">${distance}</span>` : ''}
            </div>
            ${inQueue ? `
              <div class="queue-timer${queueType === 'll' ? ' queue-timer-ll' : ''}">
                <span class="queue-timer-label">In ${queueType === 'll' ? 'LL' : 'queue'}:</span>
                <span class="queue-timer-value" data-queue-start="${queueStart}">${formatElapsedTime(queueStart)}</span>
              </div>
            ` : ''}
            ${renderShowtimes(item.showtimes)}
            ${hasNote ? `<div class="item-note">${escapeHtml(note)}</div>` : ''}
            <div class="note-editor" style="display: none;" data-entity-id="${item.id}">
              <textarea placeholder="Add a note...">${escapeHtml(note)}</textarea>
              <div class="note-editor-buttons">
                <button class="note-editor-btn cancel">Cancel</button>
                <button class="note-editor-btn save">Save</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    setupSwipeHandlers();
    startQueueTimers();

    document.querySelectorAll('.star-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const entityId = btn.dataset.entityId;
        const isNowFavorited = toggleFavorite(entityId);
        btn.classList.toggle('favorited', isNowFavorited);
      });
    });

    document.querySelectorAll('.note-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const entityId = btn.dataset.entityId;
        const card = btn.closest('.ride-card');
        const editor = card.querySelector('.note-editor');
        const noteDisplay = card.querySelector('.item-note');
        const textarea = editor.querySelector('textarea');

        // Hide any other open editors first
        document.querySelectorAll('.note-editor').forEach(ed => {
          if (ed !== editor) ed.style.display = 'none';
        });

        // Toggle this editor
        if (editor.style.display === 'none') {
          editor.style.display = 'flex';
          if (noteDisplay) noteDisplay.style.display = 'none';
          textarea.focus();
        } else {
          editor.style.display = 'none';
          if (noteDisplay) noteDisplay.style.display = 'block';
        }
      });
    });

    document.querySelectorAll('.note-editor').forEach(editor => {
      const entityId = editor.dataset.entityId;
      const card = editor.closest('.ride-card');
      const noteBtn = card.querySelector('.note-btn');
      const textarea = editor.querySelector('textarea');
      const saveBtn = editor.querySelector('.note-editor-btn.save');
      const cancelBtn = editor.querySelector('.note-editor-btn.cancel');

      saveBtn.addEventListener('click', (e) => {
        e.stopPropagation();

        const existingNote = getNote(entityId);
        textarea.value = existingNote;
        editor.style.display = 'none';
        const noteDisplay = card.querySelector('.item-note');
        if (noteDisplay) noteDisplay.style.display = 'block';
      });
    });
  }

  searchInput.addEventListener('input', renderItems);
  sortOrder.addEventListener('change', () => {
    saveSortOrder(sortOrder.value);
    renderItems();
  });
  renderItems();
}

function mergeHistory(sharedHistory) {
  const existing = getRideHistory();
  // Create a Set of existing timestamps to detect duplicates
  const existingKeys = new Set(existing.map(item => `${item.id}-${item.timestamp}`));

  // Add shared items that aren't duplicates
  const newItems = sharedHistory.filter(item => !existingKeys.has(`${item.id}-${item.timestamp}`));

  // Merge and sort by timestamp (newest first)
  const merged = [...existing, ...newItems].sort((a, b) =>
    new Date(b.timestamp) - new Date(a.timestamp)
  );

  localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
}

async function checkForSharedData() {
  // Check for shared history
  const sharedHistory = await getSharedHistoryFromUrl();
  if (sharedHistory && sharedHistory.length > 0) {
    // Small delay to let the app render first
    setTimeout(() => showImportModal(sharedHistory), 500);
    return; // Only show one import modal at a time
  }

  // Check for shared notes
  const sharedNotes = await getSharedNotesFromUrl();
  if (sharedNotes && Object.keys(sharedNotes).length > 0) {
    // Build entity name map from allEntities
    const entityNames = {};
    allEntities.forEach(entity => {
      entityNames[entity.id] = entity.name;
    });
    setTimeout(() => showNotesImportModal(sharedNotes, entityNames), 500);
  }
}

async function init() {
  // Start geolocation tracking
  updateGeolocation();

  try {
    const destinations = await fetchDestinations();

    const disneylandResort = destinations.destinations.find(d =>
      d.slug === DISNEYLAND_SLUG || d.name.includes('Disneyland Resort')
    );

    if (!disneylandResort) {
      throw new Error('Disneyland Resort not found');
    }

    parks = disneylandResort.parks.filter(p =>
      p.name.includes('Disneyland') || p.name.includes('California Adventure')
    );

    if (parks.length === 0) {
      throw new Error('No parks found');
    }

    currentParkId = parks[0].id;
    loadPark(currentParkId);

    // Check for shared data (history or notes) after app loads
    checkForSharedData();
  } catch (error) {
    console.error(error);
    showError(`Error loading parks: ${error.message}`);
  }
}

init();

// Pull-to-refresh implementation for PWA
const pullToRefresh = document.getElementById('pullToRefresh');
const pullText = pullToRefresh.querySelector('.pull-text');
let pullStartY = 0;
let isPulling = false;
let isRefreshing = false;
const PULL_THRESHOLD = 80;

async function refreshData() {
  if (isRefreshing) return;
  isRefreshing = true;

  pullToRefresh.classList.remove('pulling', 'ready', 'visible');
  pullToRefresh.classList.add('refreshing');
  pullText.textContent = 'Refreshing...';

  try {
    // Update geolocation on refresh
    await updateGeolocation();

    if (currentEntityType === 'HISTORY') {
      // History doesn't need refresh from API
      renderHistory();
    } else if (currentParkId) {
      const [childrenData, liveData] = await Promise.all([
        fetchChildren(currentParkId),
        fetchLiveData(currentParkId)
      ]);

      allEntities = childrenData.children;

      liveDataMap = new Map();
      if (liveData.liveData) {
        liveData.liveData.forEach(item => {
          liveDataMap.set(item.id, item);
        });
      }

      renderApp();
    }
    showToast('Data refreshed');
  } catch (error) {
    console.error('Refresh failed:', error);
    showToast('Refresh failed');
  }

  pullToRefresh.classList.remove('refreshing');
  pullToRefresh.style.height = '';
  pullText.textContent = 'Pull to refresh';
  isRefreshing = false;
}

function handlePullStart(e) {
  if (isRefreshing) return;
  if (window.scrollY > 0) return;

  const touch = e.touches ? e.touches[0] : e;
  pullStartY = touch.clientY;
  isPulling = true;
  pullToRefresh.classList.add('pulling');
}

function handlePullMove(e) {
  if (!isPulling || isRefreshing) return;
  if (window.scrollY > 0) {
    isPulling = false;
    pullToRefresh.classList.remove('pulling', 'visible', 'ready');
    pullToRefresh.style.height = '';
    return;
  }

  const touch = e.touches ? e.touches[0] : e;
  const pullDistance = Math.max(0, touch.clientY - pullStartY);

  if (pullDistance > 0) {
    e.preventDefault();
    const height = Math.min(pullDistance * 0.5, 100);
    pullToRefresh.style.height = height + 'px';

    if (height > 10) {
      pullToRefresh.classList.add('visible');
    }

    if (pullDistance > PULL_THRESHOLD) {
      pullToRefresh.classList.add('ready');
      pullText.textContent = 'Release to refresh';
    } else {
      pullToRefresh.classList.remove('ready');
      pullText.textContent = 'Pull to refresh';
    }
  }
}

function handlePullEnd() {
  if (!isPulling || isRefreshing) return;
  isPulling = false;
  pullToRefresh.classList.remove('pulling');

  const height = parseInt(pullToRefresh.style.height) || 0;
  if (height > PULL_THRESHOLD * 0.5) {
    refreshData();
  } else {
    pullToRefresh.classList.remove('visible', 'ready');
    pullToRefresh.style.height = '';
    pullText.textContent = 'Pull to refresh';
  }
}

document.addEventListener('touchstart', handlePullStart, { passive: true });
document.addEventListener('touchmove', handlePullMove, { passive: false });
document.addEventListener('touchend', handlePullEnd);

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
